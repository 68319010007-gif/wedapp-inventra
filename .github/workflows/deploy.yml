name: Deploy

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/wedapp-inventra-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/wedapp-inventra-frontend
  DEPLOY_DIR: ~/apps/68319010007

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: ${{ env.FRONTEND_IMAGE }}:latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}/repo
            if [ ! -d ${{ env.DEPLOY_DIR }}/repo/.git ]; then
              git clone https://github.com/68319010007-gif/wedapp-inventra.git ${{ env.DEPLOY_DIR }}/repo
            else
              cd ${{ env.DEPLOY_DIR }}/repo && git pull
            fi
            cd ${{ env.DEPLOY_DIR }}/repo
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            POSTGRES_USER=inventra
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=inventra
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            docker compose -f docker-compose.deploy.yml exec -T backend npx prisma migrate deploy
